    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f5ef;
        --text: #181818;
        --muted: #55524c;
        --rule: #d8d3c7;
        --card: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --text: #f4f1ea;
          --muted: #bdb7aa;
          --rule: #38342d;
          --card: #1d1d1d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.6;
      }

      main {
        display: grid;
        flex: 1;
        place-items: center;
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0;
      }

      header {
        margin: 0;
        width: min(100%, 920px);
      }

      h1 {
        margin: 0;
        background: linear-gradient(90deg, #ff66c4, #ffde59);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      h1 {
        font-size: clamp(2.25rem, 7vw, 5rem);
        line-height: 1;
        letter-spacing: 0;
        overflow-wrap: break-word;
        white-space: normal;
      }

      .latest {
        margin-top: 32px;
        width: 100%;
      }

      .post-card {
        display: block;
        width: 100%;
        padding: 20px;
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
      }

      .post-card:hover h2,
      .post-card:focus h2 {
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      .post-card h2 {
        margin: 0;
        color: var(--text);
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.25;
      }

      .post-card p {
        margin-top: 10px;
        color: var(--muted);
        font-size: 1rem;
      }

      footer {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 0 0 32px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      a {
        color: inherit;
        text-underline-offset: 0.18em;
      }

      @media (max-width: 960px) {
        main {
          width: min(calc(100% - 32px), 680px);
          padding: 56px 0;
        }

        header {
          width: 100%;
        }

        h1 {
          font-size: clamp(2.1rem, 13vw, 3.5rem);
          line-height: 1.05;
          white-space: normal;
        }

        .latest {
          margin-top: 28px;
        }

        .post-card {
          padding: 18px;
        }

        .post-card h2 {
          font-size: 1.1rem;
        }

        footer {
          width: min(calc(100% - 32px), 680px);
          padding-bottom: 24px;
        }
      }

      @media (min-width: 721px) and (max-width: 960px) {
        main,
        footer {
          width: min(calc(100% - 48px), 680px);
        }

        h1 {
          font-size: clamp(3rem, 8vw, 4.4rem);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Vulnerability Research x Data Science</h1>
        <div class="latest">
          <a class="post-card" href="posts/llm-vulnerability-research.html">
            <h2>Can local open-weight LLMs detect vulnerabilities, or do they mostly just guess?</h2>
            <p>
              A local experiment in vulnerability detection using open-weight
              LLMs, fine-tuning, prompt/context design and ensemble methods.
            </p>
          </a>
        </div>
      </header>
    </main>
    <footer>
      by Martina Tivadar,
      <a href="https://x.com/xmartinaxo" rel="me">@xmartinaxo</a>
    </footer>
  </body>
</html>
